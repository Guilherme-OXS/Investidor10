<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a11"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Monograma IL estilizado com vetor de crescimento / lucro -->
  <g filter="url(#glow)">
    <!-- Barra vertical do 'I' -->
    <rect x="24" y="24" width="12" height="52" rx="4" fill="url(#primaryGrad)"/>

    <!-- Base e haste do 'L' -->
    <path d="M 44 24 L 56 24 L 56 64 L 74 64 L 74 76 L 44 76 Z" fill="url(#primaryGrad)"/>

    <!-- Seta ascendente geométrica (Lucro / Crescimento) -->
    <polygon points="76,46 76,28 58,28" fill="url(#accentGrad)"/>
    <line x1="52" y1="52" x2="74" y2="30" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
